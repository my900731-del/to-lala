<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 有一個溫柔的邀請 🌸</title>
    <style>
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; background: linear-gradient(135deg, #fff0f5 0%, #ffe3ec 100%);
            font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif; overflow: hidden; position: relative;
        }
        /* 櫻花背景裝飾 */
        .sakura {
            position: absolute; background: #ffb7c5; border-radius: 100% 0 100% 100%;
            opacity: 0.7; animation: fall linear infinite; pointer-events: none; z-index: 1;
        }
        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(105vh) translateX(100px) rotate(360deg); opacity: 0; }
        }
        /* 白色圓角卡片 */
        .card {
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 40px;
            border-radius: 24px; box-shadow: 0 12px 40px rgba(255, 182, 193, 0.3);
            text-align: center; max-width: 480px; width: 90%; transition: height 0.3s ease;
            z-index: 10; border: 2px solid #ffe3ec; box-sizing: border-box; position: relative;
        }
        /* 愛心圖形容器與動畫 */
        .heart-container {
            width: 150px; height: 150px; margin: 0 auto 20px auto;
            display: flex; justify-content: center; align-items: center;
        }
        .heart-svg {
            width: 120px; height: 120px; fill: #ff4d6d;
            animation: heartbeat 1.2s infinite ease-in-out;
        }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            15% { transform: scale(1.15); }
            30% { transform: scale(1); }
            45% { transform: scale(1.15); }
            70% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        h1 { color: #d90429; font-size: 26px; margin-bottom: 15px; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
        p { color: #5c1328; font-size: 16px; line-height: 1.8; margin-bottom: 25px; }
        .btn-group { display: flex; justify-content: center; align-items: center; gap: 20px; height: 80px; position: relative; width: 100%; }
        button { padding: 14px 35px; font-size: 18px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.2s, background-color 0.2s, left 0.2s ease, top 0.2s ease; }
        #yesBtn { background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%); color: white; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4); white-space: nowrap; z-index: 11; }
        #yesBtn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6); }
        #noBtn { background-color: #d1d1d1; color: #555; position: absolute; z-index: 12; }
        .input-date { padding: 12px 20px; font-size: 18px; border-radius: 12px; border: 2px solid #ffb7c5; color: #5c1328; outline: none; margin-bottom: 25px; width: 80%; text-align: center; }
        .food-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 25px; }
        .food-btn { background-color: #fff; color: #ff4d6d; border: 2px solid #ffe3ec; padding: 12px; font-size: 16px; border-radius: 15px; transition: all 0.2s; }
        .food-btn:hover, .food-btn.active { background: #ff4d6d; color: white; border-color: #ff4d6d; transform: translateY(-2px); }
        .love-letter { text-align: left; background: #fffafb; padding: 25px; border-radius: 15px; border-left: 5px solid #ff4d6d; margin-top: 15px; }
        .love-letter p { margin-bottom: 12px; font-size: 15px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 步驟 1 -->
    <div class="card" id="step1">
        <div class="heart-container">
            <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
        </div>
        <h1>🌸拉拉要不要跟我去約會?🌸</h1>
        <p>我有個很棒的行程，想跟妳一起度過！✨</p>
        <div class="btn-group">
            <button id="yesBtn" onclick="nextStep(1, 2)">好哦❤️</button>
            <button id="noBtn" onmouseover="flyAway()" onclick="flyAway()">No👋</button>
        </div>
    </div>

    <!-- 步驟 2 -->
    <div class="card hidden" id="step2">
        <div class="heart-container">
            <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
        </div>
        <h1>🌸 那選一天吧！🌸</h1>
        <p>哪一天是屬於我們的日子呢？🥰</p>
        <input type="date" id="datePicker" class="input-date">
        <div><button style="background: #ff4d6d; color: white;" onclick="submitDate()">就這天!❤️</button></div>
    </div>

    <!-- 步驟 3 -->
    <div class="card hidden" id="step3">
        <div class="heart-container">
            <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
        </div>
        <h1>🌸 妳今天想吃點什麼？🌸</h1>
        <p>只要妳想吃的，我都帶妳去吃！🍟</p>
        <div class="food-grid">
            <button class="food-btn" onclick="selectFood(this)">火鍋 🍲</button>
            <button class="food-btn" onclick="selectFood(this)">牛排 🥩</button>
            <button class="food-btn" onclick="selectFood(this)">燒烤 🍖</button>
            <button class="food-btn" onclick="selectFood(this)">滷肉飯 🍚</button>
            <button class="food-btn" onclick="selectFood(this)">夜市小吃 🧋</button>
            <button class="food-btn" onclick="selectFood(this)">拉麵 🍜</button>
            <button class="food-btn" onclick="selectFood(this)">鍋貼 🥟</button>
            <button class="food-btn" onclick="selectFood(this)">其他選擇 🍽️</button>
        </div>
        <div><button style="background: #ff4d6d; color: white;" onclick="nextStep(3, 4)">選好了!❤️</button></div>
    </div>

    <!-- 步驟 4 -->
    <div class="card hidden" id="step4">
        <div class="heart-container">
            <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
        </div>
        <h1 style="color: #38b000;">給妳的一封信 ✉️</h1>
        <div class="love-letter">
            <p><strong>給願意和我約會的妳:</strong></p>
            <p>很開心妳沒有說不要。</p>
            <p>謝謝妳願意把一天留給我。這天不管做什麼、行程多滿，我都會去接妳💕。</p>
            <p>去哪裡、吃什麼其實都不重要，只要是跟妳一起，我就已經編織起期待了。</p>
            <p style="color: #ff4d6d; font-weight: bold; margin-top: 15px;">P.S.雖然我們還沒交往，但我會偷偷想像，我們交往後一起幸福的樣子💍。</p>
            <p style="text-align: right; font-weight: bold; margin-top: 10px;">到時候見❤️ 愛妳的發發</p>
        </div>
    </div>

    <script>
        function createSakura() {
            const sakura = document.createElement('div');
            sakura.classList.add('sakura');
            sakura.style.left = Math.random() * window.innerWidth + 'px';
            const size = Math.random() * 12 + 8;
            sakura.style.width = size + 'px'; sakura.style.height = size + 'px';
            sakura.style.animationDuration = Math.random() * 3 + 4 + 's';
            document.body.appendChild(sakura);
            setTimeout(() => { sakura.remove(); }, 6000);
        }
        setInterval(createSakura, 300);

        const today = new Date().toISOString().split('T')[0];
        document.getElementById('datePicker').min = today;

        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const card1 = document.getElementById('step1');
        let clickCount = 0; let btnScale = 1;

        function flyAway() {
            const padding = 40;
            const maxW = card1.clientWidth - noBtn.clientWidth - padding;
            const minTop = 220; 
            const maxH = card1.clientHeight - noBtn.clientHeight - padding;

            const randomX = Math.max(padding, Math.random() * maxW);
            const randomY = Math.max(minTop, Math.random() * maxH);
            const cardRect = card1.getBoundingClientRect();
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = (cardRect.left + randomX) + 'px';
            noBtn.style.top = (cardRect.top + randomY) + 'px';

            clickCount++; btnScale += 0.25;
            yesBtn.style.transform = `scale(${btnScale})`;
            if (clickCount >= 3) yesBtn.innerText = "看來妳真的很想去喔！❤️";
        }

        function nextStep(current, next) {
            document.getElementById(`step${current}`).classList.add('hidden');
            document.getElementById(`step${next}`).classList.remove('hidden');
        }

        function submitDate() {
            if (!document.getElementById('datePicker').value) { alert("請選一個浪漫的日子嘛 🌸"); return; }
            nextStep(2, 3);
        }

        function selectFood(element) {
            document.querySelectorAll('.food-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        window.addEventListener('resize', () => {
            if(clickCount > 0 && !card1.classList.contains('hidden')) {
                noBtn.style.position = 'static'; noBtn.style.transform = 'none';
                clickCount = 0; btnScale = 1; yesBtn.style.transform = 'scale(1)'; yesBtn.innerText = "好哦❤️";
            }
        });
    </script>
</body>
</html>
