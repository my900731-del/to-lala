<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌸 有一個溫柔的邀請 🌸</title>
  <style>
    body {
      margin: 0; padding: 0; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden; position: relative;
      background: linear-gradient(135deg, #fff0f5 0%, #ffe3ec 100%);
      font-family: 'Helvetica Neue', Arial, 'Noto Sans TC', sans-serif;
    }
    .sakura {
      position: absolute; background: #ffb7c5; border-radius: 100% 0 100% 100%;
      opacity: 0.7; pointer-events: none; z-index: 1; animation: fall linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(105vh) translateX(100px) rotate(360deg); opacity: 0; }
    }
    .card {
      background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 30px 25px;
      border-radius: 24px; text-align: center; max-width: 420px; width: 92%; z-index: 10;
      border: 2px solid #ffe3ec; box-sizing: border-box; position: relative;
      max-height: 85vh; overflow-y: auto; overflow-x: hidden;
      box-shadow: 0 12px 40px rgba(255,182,193,0.3);
    }
    .card::-webkit-scrollbar { width: 4px; }
    .card::-webkit-scrollbar-thumb { background: #ffb7c5; border-radius: 4px; }
    .heart-container { width: 120px; height: 120px; margin: 0 auto 15px auto; display: flex; justify-content: center; align-items: center; }
    .heart-svg { width: 90px; height: 90px; fill: #ff4d6d; animation: heartbeat 1.2s infinite ease-in-out; }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      15% { transform: scale(1.15); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
      70% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    h1 { color: #d90429; font-size: 22px; margin-bottom: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.05); }
    p { color: #5c1328; font-size: 15px; line-height: 1.7; margin-bottom: 20px; }
    
    .btn-group { 
      display: flex; justify-content: space-between; align-items: center; 
      padding: 0 20px; height: 110px; position: relative; width: 100%; box-sizing: border-box;
    }
    button { padding: 12px 30px; font-size: 17px; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.2s; }
    
    #yesBtn { 
      background: linear-gradient(135deg, #ff4d6d 0%, #ff758f 100%); 
      color: white; white-space: nowrap; z-index: 11; box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4); 
    }
    #yesBtn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255, 77, 109, 0.6); }
    #noBtn { background-color: #d1d1d1; color: #555; position: absolute; z-index: 12; transition: left 0.2s ease, top 0.2s ease; right: 20px; }
    
    .input-date { padding: 12px 20px; font-size: 17px; border-radius: 12px; border: 2px solid #ffb7c5; color: #5c1328; outline: none; margin-bottom: 20px; width: 85%; text-align: center; box-sizing: border-box; }
    .food-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
    .food-btn { background-color: #fff; color: #ff4d6d; border: 2px solid #ffe3ec; padding: 10px; font-size: 15px; border-radius: 15px; transition: all 0.2s; }
    .food-btn:hover, .food-btn.active { background: #ff4d6d; color: white; border-color: #ff4d6d; transform: translateY(-2px); }
    
    .love-letter { text-align: left; background: #fffafb; padding: 20px; border-radius: 15px; border-left: 5px solid #ff4d6d; margin-top: 10px; }
    .love-letter p { margin-bottom: 10px; font-size: 14px; line-height: 1.6; }
    
    .line-send-btn {
      background: linear-gradient(135deg, #06C755 0%, #05b34c 100%);
      color: white; width: 100%; padding: 14px; font-size: 18px; font-weight: bold;
      border: none; border-radius: 50px; cursor: pointer; margin-top: 20px;
      box-shadow: 0 4px 15px rgba(6, 199, 85, 0.4); transition: all 0.3s;
    }
    .line-send-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 199, 85, 0.6); }
    
    .hidden { display: none !important; }
    @media (max-width: 380px) {
      .card { padding: 20px 15px; }
      h1 { font-size: 19px; }
      p { font-size: 14px; }
      button { padding: 10px 22px; font-size: 15px; }
      .heart-container { width: 100px; height: 100px; }
      .heart-svg { width: 75px; height: 75px; }
    }
  </style>
</head>
<body>

  <!-- 步驟 1 -->
  <div class="card" id="step1">
    <div class="heart-container">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
    </div>
    <h1>🌸拉拉要不要跟我去約會?🌸</h1>
    <p>我有個很棒的行程，想跟妳一起度過！✨</p>
    <div class="btn-group">
      <button id="yesBtn" onclick="nextStep(1, 2)">好哦❤️</button>
      <button id="noBtn" onmouseover="flyAway()" onclick="flyAway()">No👋</button>
    </div>
  </div>

  <!-- 步驟 2 -->
  <div class="card hidden" id="step2">
    <div class="heart-container">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
    </div>
    <h1>🌸 那選一天吧！🌸</h1>
    <p>哪一天是屬於我們的日子呢？🥰</p>
    <input type="date" id="datePicker" class="input-date">
    <div><button style="background: #ff4d6d; color: white;" onclick="submitDate()">就這天!❤️</button></div>
  </div>

  <!-- 步驟 3 -->
  <div class="card hidden" id="step3">
    <div class="heart-container">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
    </div>
    <h1>🌸 妳今天想吃點什麼？🌸</h1>
    <p>只要妳想吃的，我都帶妳去吃！🍟</p>
    <div class="food-grid">
      <button class="food-btn" onclick="selectFood(this, '火鍋 🍲')">火鍋 🍲</button>
      <button class="food-btn" onclick="selectFood(this, '牛排 🥩')">牛排 🥩</button>
      <button class="food-btn" onclick="selectFood(this, '燒烤 🍖')">燒烤 🍖</button>
      <button class="food-btn" onclick="selectFood(this, '滷肉飯 🍚')">滷肉飯 🍚</button>
      <button class="food-btn" onclick="selectFood(this, '夜市小吃 🧋')">夜市小吃 🧋</button>
      <button class="food-btn" onclick="selectFood(this, '拉麵 🍜')">拉麵 🍜</button>
      <button class="food-btn" onclick="selectFood(this, '鍋貼 🥟')">鍋貼 🥟</button>
      <button class="food-btn" onclick="selectFood(this, '其他選擇 🍽️')">其他選擇 🍽️</button>
    </div>
    <div><button style="background: #ff4d6d; color: white;" onclick="submitFoodAndNext()">選好了!❤️</button></div>
  </div>

  <!-- 步驟 4 -->
  <div class="card hidden" id="step4">
    <div class="heart-container">
      <svg class="heart-svg" viewBox="0 0 32 32"><path d="M16 28.5c-.5 0-1-.2-1.4-.6l-9.3-9.3C2.1 15.4 2.1 10.4 5.3 7.2c3-3 7.9-3 10.7 0l0 0c2.8-3 7.7-3 10.7 0 3.2 3.2 3.2 8.2.1 11.4l-9.3 9.3c-.4.4-.9.6-1.5.6z"/></svg>
    </div>
    <h1 style="color: #38b000;">給妳的一封信 ✉️</h1>
    <div class="love-letter">
      <p><strong>給願意和我約會的妳:</strong></p>
      <p>很開心妳沒有說不要。</p>
      <p>謝謝妳願意把一天留給我。</p>
      <p>這天不管做什麼、行程多滿，我都會去接妳💕。</p>
      <p>去哪裡、吃什麼其實都不重要，只要是跟妳一起，我就已經很起期待了。</p>
      <p style="color: #ff4d6d; font-weight: bold; margin-top: 15px;">P.S.雖然我們還沒交往，但我會偷偷想像，我們交往後一起幸福的樣子💍。</p>
      <p style="text-align: right; font-weight: bold; margin-top: 10px;">到時候見❤️ 喜歡妳的發發</p>
    </div>
    <button class="line-send-btn" onclick="sendToLine()">把答案發給發發 ❤️</button>
  </div>

  <script>
    let selectedDate = "";
    let selectedFood = "";

    // 櫻花飄落效果
    function createSakura() {
      const sakura = document.createElement('div'); 
      sakura.classList.add('sakura');
      sakura.style.left = Math.random() * window.innerWidth + 'px';
      const size = Math.random() * 12 + 8;
      sakura.style.width = size + 'px'; 
      sakura.style.height = size + 'px';
      sakura.style.animationDuration = Math.random() * 3 + 3 + 's';
      document.body.appendChild(sakura);
      setTimeout(() => { sakura.remove(); }, 6000);
    }
    setInterval(createSakura, 300);

    // 切換步驟
    function nextStep(current, next) {
      document.getElementById(`step${current}`).classList.add('hidden');
      document.getElementById(`step${next}`).classList.remove('hidden');
    }

    // 拒絕按鈕隨機閃躲
    function flyAway() {
      const noBtn = document.getElementById('noBtn');
      const card = document.getElementById('step1');
      const rect = card.getBoundingClientRect();
      const randomX = Math.random() * (rect.width - 100) + 10;
      const randomY = Math.random() * (110 - 40) + 10;
      noBtn.style.left = randomX + 'px';
      noBtn.style.top = randomY + 'px';
    }

    // 提交日期
    function submitDate() {
      const dateInput = document.getElementById('datePicker').value;
      if (!dateInput) {
        alert("請選一個日子嘛 🥺");
        return;
      }
      selectedDate = dateInput;
      nextStep(2, 3);
    }

    // 選擇食物
    function selectFood(btn, food) {
      const buttons = document.querySelectorAll('.food-btn');
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedFood = food;
    }

    // 提交食物
    function submitFoodAndNext() {
      if (!selectedFood) {
        alert("挑一個妳想吃的嘛 🍧");
        return;
      }
      nextStep(3, 4);
    }

    // 串接 LINE 自動填入訊息
    function sendToLine() {
      const baseText = `發發！我答應你的約會邀請囉❤️\n📅 約會日期：${selectedDate}\n🍲 想吃的美食：${selectedFood}\n\n那到時候見囉！✨`;
      const encodedText = encodeURIComponent(baseText);
      window.location.href = `https://line.me{encodedText}`;
    }
  </script>
</body>
</html>
